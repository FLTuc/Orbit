name: Version telephone (PWA)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fichiers generes a jour (blagues, culture G, decoupeur, cache hors ligne)
        run: python3 tools/build_pwa.py --check

      - name: Securite du code
        run: node tests/pwa/static.mjs

      - name: Logique (tableaux, chrono, Brain Dump, DopaList, Unstick Me, zip, attaques)
        run: node tests/pwa/unit.mjs

      - name: Installation du navigateur de test
        working-directory: tests/pwa
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Parcours complet sur un telephone simule (Pixel 7)
        working-directory: tests/pwa
        run: node e2e.cjs

      - name: Site pret a mettre en ligne (zip)
        uses: actions/upload-artifact@v4
        with:
          name: orbit-telephone-site
          path: |
            pwa
            !pwa/sw.template.js

  # Mise en ligne sur GitHub Pages (https://<compte>.github.io/<depot>/), seulement depuis main
  # ou a la demande. GitHub Pages doit etre active (Settings > Pages > Source : GitHub Actions) ;
  # sur un depot prive, il faut un abonnement GitHub Pro. Sinon cette etape est ignoree.
  pages:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: rm -f pwa/sw.template.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deploy
        uses: actions/deploy-pages@v4
