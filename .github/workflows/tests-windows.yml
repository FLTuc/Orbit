name: Tests Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe et encodage (PowerShell 5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\parse.ps1

      - name: Securite (analyse du code)
        shell: pwsh
        run: ./tests/security.ps1

      - name: Tests unitaires et logique (dont attaques simulees)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\logic.ps1

      - name: Chargement complet d'Orbit (1er lancement)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File tests\selftest.ps1 -Fresh

      - name: 2e lancement (code natif deja en cache)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File tests\selftest.ps1

      - name: Blagues et culture G
        shell: cmd
        run: python tools\check_jokes.py && python tools\check_jokes.py --dir culture --min 300
